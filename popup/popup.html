<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麻薯翻译</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- 头部 -->
    <header class="popup-header">
      <div class="logo">
        <span class="logo-emoji">🟤</span>
        <span class="logo-text">麻薯翻译</span>
      </div>
      <div class="version">v1.0</div>
    </header>

    <!-- 状态开关 -->
    <section class="popup-section">
      <div class="switch-row">
        <span class="switch-label">启用翻译</span>
        <label class="switch">
          <input type="checkbox" id="enableTranslate" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="switch-row">
        <span class="switch-label">显示悬浮窗</span>
        <label class="switch">
          <input type="checkbox" id="enableFloat" checked>
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <!-- 语言设置 -->
    <section class="popup-section">
      <div class="lang-row">
        <label for="sourceLang">源语言</label>
        <select id="sourceLang">
          <option value="auto">自动检测</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="ru">Русский</option>
          <option value="pt">Português</option>
          <option value="it">Italiano</option>
          <option value="ar">العربية</option>
          <option value="th">ภาษาไทย</option>
          <option value="vi">Tiếng Việt</option>
        </select>
      </div>
      <div class="lang-row">
        <label for="targetLang">目标语言</label>
        <select id="targetLang">
          <option value="zh-CN" selected>中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="ru">Русский</option>
          <option value="pt">Português</option>
          <option value="it">Italiano</option>
        </select>
      </div>
    </section>

    <!-- 翻译引擎 -->
    <section class="popup-section">
      <div class="engine-row">
        <label for="engine">翻译引擎</label>
        <select id="engine">
          <option value="baidu">百度翻译 (免费，国内可用)</option>
          <option value="google">Google 翻译 (免费，国内可能不可用)</option>
          <option value="microsoft">微软翻译 (需API Key)</option>
          <option value="youdao">有道翻译 (需AppKey)</option>
        </select>
      </div>
      <div id="apiConfig" class="api-config hidden">
        <p class="config-hint">⚙️ 请在设置页面配置 API Key</p>
      </div>
    </section>

    <!-- 快捷操作 -->
    <section class="popup-section actions">
      <button id="translatePage" class="btn btn-primary">
        📄 翻译当前页面
      </button>
      <button id="translateClipboard" class="btn btn-secondary">
        📋 翻译剪贴板
      </button>
    </section>

    <!-- 底部 -->
    <footer class="popup-footer">
      <a href="#" id="openOptions">⚙️ 设置</a>
      <a href="#" id="feedback">💬 反馈</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
